name: Release Linux and macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unix-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RID: ${{ matrix.rid }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate release
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Test library
        run: dotnet run --project EastwardLib/tests/EastwardLib.Tests -c Release
      - name: Publish and package tools
        run: |
          mkdir -p artifacts
          for tool in EastwardPacker AtlasExtractor Hmg2Image Image2Hmg; do
            dotnet publish "$tool" -c Release -r "$RID" --self-contained true -p:Version="$VERSION" -o "publish/$tool"
            test -x "publish/$tool/$tool"
            test -d "publish/$tool/licenses"
            tar -czf "artifacts/$tool-$VERSION-$RID.tar.gz" -C publish "$tool"
          done
      - name: Test published archive round trip
        run: |
          mkdir -p smoke/input
          printf 'Eastward release test' > smoke/input/test.txt
          publish/EastwardPacker/EastwardPacker --pack --input_dir smoke/input --output smoke/release.g
          publish/EastwardPacker/EastwardPacker --input smoke/release.g --output_dir smoke/extracted
          cmp smoke/input/test.txt smoke/extracted/release/test.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
      - name: Upload to existing release
        run: gh release upload "$RELEASE_TAG" artifacts/*.tar.gz --clobber
